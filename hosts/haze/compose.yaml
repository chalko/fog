services:
  vllm-qwen38:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen38

    restart: unless-stopped
    ipc: host
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
      - VLLM_USE_DEEP_GEMM=0
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - VLLM_USAGE_SOURCE=production

    volumes:
      - ${HF_CACHE_DIR:-/var/cache/huggingface}:/root/.cache/huggingface
    ports:
      - "${VLLM_PORT:-8000}:8000"
    command:
      - "--model"
      - "Qwen/Qwen3.8-27B-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--trust-remote-code"
      - "--max-model-len"
      - "131072"
      - "--gpu-memory-utilization"
      - "0.55"
      - "--enforce-eager"





    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
