services:
  vllm-llama33:
    image: vllm/vllm-openai:latest
    container_name: vllm-llama33

    restart: unless-stopped
    ipc: host
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - VLLM_USAGE_SOURCE=production

    volumes:
      - ${HF_CACHE_DIR:-/var/cache/huggingface}:/root/.cache/huggingface
    ports:
      - "${VLLM_PORT:-8000}:8000"
    command:
      - "neuralmagic/Llama-3.3-70B-Instruct-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--kv-cache-dtype"
      - "fp8"
      - "--safetensors-load-strategy"
      - "eager"
      - "--enforce-eager"
      - "--enable-prefix-caching"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
