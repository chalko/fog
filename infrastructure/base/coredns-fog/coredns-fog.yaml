apiVersion: v1
kind: Namespace
metadata:
  name: coredns-fog
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-fog
  namespace: coredns-fog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-fog-config
  namespace: coredns-fog
data:
  Corefile: |
    fog.chalko.com:53 {
        log
        errors
        health :8080
        # Serve all *.fog.chalko.com A-records pointing to 10.7.82.16 (K8s Ingress IP)
        template IN A fog.chalko.com {
            match .*\.fog\.chalko\.com
            answer "{{ .Name }} 60 IN A 10.7.82.16"
        }
    }
    .:53 {
        log
        errors
        forward . 10.5.110.3 1.1.1.1
        cache 30
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-fog
  namespace: coredns-fog
  labels:
    app: coredns-fog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coredns-fog
  template:
    metadata:
      labels:
        app: coredns-fog
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-47e-fbr
      serviceAccountName: coredns-fog
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.12.0
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
        args: [ "-conf", "/etc/coredns/Corefile" ]

        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
        ports:
        - containerPort: 53
          hostPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          hostPort: 53
          name: dns-tcp
          protocol: TCP

        - containerPort: 8080
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      volumes:
      - name: config-volume
        configMap:
          name: coredns-fog-config
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-fog
  namespace: coredns-fog
spec:
  type: NodePort
  selector:
    app: coredns-fog
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    nodePort: 30053
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    nodePort: 30053
    protocol: TCP
