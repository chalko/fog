apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana-dashboards

  proxmox-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Proxmox Hypervisor CPU Usage (%)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}} CPU" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Proxmox Node Memory Usage (GB)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / 1024 / 1024 / 1024", "legendFormat": "Used RAM (GB)" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "title": "VM & LXC Storage Utilization",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\"} * 100) / node_filesystem_size_bytes{mountpoint=\"/\"})", "legendFormat": "Root FS Used %" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["proxmox", "infrastructure"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Proxmox VE Hypervisor Dashboard",
      "uid": "proxmox-ve-overview"
    }

  k8s-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": null,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Kubernetes Pod Count",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "count(kube_pod_info)", "legendFormat": "Total Pods" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Container Restarts (5m Rate)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(increase(kube_pod_container_status_restarts_total[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "title": "Cluster Network Throughput (MB/s)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(rate(container_network_receive_bytes_total[5m])) / 1024 / 1024", "legendFormat": "RX MB/s" },
            { "datasource": "Prometheus", "expr": "sum(rate(container_network_transmit_bytes_total[5m])) / 1024 / 1024", "legendFormat": "TX MB/s" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["k8s", "kubernetes"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Kubernetes Cluster Dashboard",
      "uid": "k8s-cluster-overview"
    }

  ollama-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": null,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Ollama LLM Active Inferences",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(ollama_active_requests)", "legendFormat": "Active Requests" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Token Generation Speed (tokens/sec)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "rate(ollama_tokens_generated_total[1m])", "legendFormat": "Tokens/sec" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "title": "Ollama GPU / RAM Memory Usage (GB)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "ollama_model_memory_bytes / 1024 / 1024 / 1024", "legendFormat": "{{model}} Memory" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ollama", "llm", "ai"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Ollama LLM Engine Dashboard",
      "uid": "ollama-llm-overview"
    }

  litellm-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": null,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "LiteLLM Router Request Rate (req/s)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(rate(litellm_requests_total[1m])) by (model)", "legendFormat": "{{model}}" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "LiteLLM Latency p95 (ms)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "histogram_quantile(0.95, sum(rate(litellm_request_duration_seconds_bucket[5m])) by (le)) * 1000", "legendFormat": "p95 Latency ms" }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "title": "LiteLLM Token Usage (Prompt vs Completion)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(rate(litellm_input_tokens_total[5m]))", "legendFormat": "Input Tokens/s" },
            { "datasource": "Prometheus", "expr": "sum(rate(litellm_output_tokens_total[5m]))", "legendFormat": "Output Tokens/s" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["litellm", "llm", "proxy"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "LiteLLM Proxy Router Dashboard",
      "uid": "litellm-proxy-overview"
    }

  executive-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": null,
      "panels": [
        {
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Hypervisor Status",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "up{job=\"proxmox\"}", "legendFormat": "Proxmox Node" }
          ]
        },
        {
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Cluster Pods",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "count(kube_pod_info)", "legendFormat": "Active Pods" }
          ]
        },
        {
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Ollama LLM Engine",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "up{job=\"ollama\"}", "legendFormat": "Ollama Service" }
          ]
        },
        {
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "LiteLLM Proxy",
          "type": "stat",
          "targets": [
            { "datasource": "Prometheus", "expr": "up{job=\"litellm\"}", "legendFormat": "LiteLLM Gateway" }
          ]
        },
        {
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 6 },
          "id": 5,
          "title": "Top-Level System CPU & Memory Utilization",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU Load %" },
            { "datasource": "Prometheus", "expr": "(sum(node_memory_MemTotal_bytes) - sum(node_memory_MemAvailable_bytes)) / sum(node_memory_MemTotal_bytes) * 100", "legendFormat": "RAM Load %" }
          ]
        },
        {
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 6 },
          "id": 6,
          "title": "LLM Workload Throughput (LiteLLM vs Ollama)",
          "type": "timeseries",
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(rate(litellm_requests_total[1m]))", "legendFormat": "LiteLLM Router req/s" },
            { "datasource": "Prometheus", "expr": "sum(rate(ollama_tokens_generated_total[1m]))", "legendFormat": "Ollama tokens/s" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["executive", "pilot", "overview"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Executive Pilot Combo Dashboard",
      "uid": "executive-pilot-overview"
    }
