apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # Logical Tiers
      - model_name: utility-tier
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: https://ollama.fog.chalko.com
      - model_name: worker-tier
        litellm_params:
          model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
          api_base: https://8zzicwtx96fnfl-8000.proxy.runpod.net/v1
          api_key: "none"
          extra_headers:
            User-Agent: "vLLM/Client"
          timeout: 120











      - model_name: executive-tier
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: executive-tier
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"

      
      # Legacy / Specific Models (Backwards Compatibility)
      - model_name: gemini-flash-lite
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-3.6-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: grok-2
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"
      - model_name: grok-4.5
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"
      - model_name: grok-beta
        litellm_params:
          model: xai/grok-beta
          api_key: "os.environ/XAI_API_KEY"
      - model_name: llama3.2
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: https://ollama.fog.chalko.com
    
    router_settings:
      fallbacks:
        - worker-tier: ["gemini-flash", "utility-tier"]
        - utility-tier: ["gemini-flash-lite"]
      num_retries: 2
      retry_after: 5


      
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      background_health_checks: true
