apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # --- Logical Tiers (5-Tier Scheme) ---
      - model_name: worker-coder
        litellm_params:
          model: gemini/gemini-3.6-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: worker-general
        litellm_params:
          model: gemini/gemini-3.6-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: utility-fast
        litellm_params:
          model: ollama/llama3.2:3b
          api_base: https://ollama.fog.chalko.com
      - model_name: utility-simple
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: https://ollama.fog.chalko.com
      - model_name: utility-simple
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: https://ollama.fog.chalko.com

      # --- DEPRECATED: Legacy Logical Tiers (Kept for backwards compatibility until Gas City is updated) ---
      - model_name: utility-tier
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: https://ollama.fog.chalko.com
      - model_name: worker-tier
        litellm_params:
          model: gemini/gemini-3.6-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: executive-tier
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: executive-tier
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"

      # --- Model Aliases (Version Governance) ---
      - model_name: gemini-flash-lite
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-3.6-flash
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: "os.environ/GEMINI_API_KEY"
      - model_name: grok-2
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"
      - model_name: grok-4.5
        litellm_params:
          model: xai/grok-4.5
          api_key: "os.environ/XAI_API_KEY"
      - model_name: grok-beta
        litellm_params:
          model: xai/grok-beta
          api_key: "os.environ/XAI_API_KEY"
      - model_name: llama3.2
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: https://ollama.fog.chalko.com

    router_settings:
      fallbacks:
        - worker-coder: ["gemini-pro", "utility-fast"]
        - worker-general: ["gemini-flash-lite", "utility-fast"]
        - worker-tier: ["gemini-pro", "utility-tier"]
        - utility-tier: ["gemini-flash-lite"]
        - utility-fast: ["gemini-flash-lite"]
      num_retries: 2
      retry_after: 5

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      background_health_checks: true
