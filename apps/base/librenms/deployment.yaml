apiVersion: v1
kind: Service
metadata:
  name: librenms
  namespace: librenms
  labels:
    app.kubernetes.io/name: librenms
    app.kubernetes.io/component: app
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: librenms
    app.kubernetes.io/component: app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librenms-data
  namespace: librenms
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "local-path"
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librenms
  namespace: librenms
  labels:
    app.kubernetes.io/name: librenms
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: librenms
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librenms
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: librenms-sa
      containers:
        - name: librenms
          image: librenms/librenms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DB_HOST
              value: "librenms-db"
            - name: DB_NAME
              value: "librenms"
            - name: DB_USER
              value: "librenms"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librenms-secrets
                  key: DB_PASSWORD
                  optional: true
            - name: REDIS_HOST
              value: "librenms-redis"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librenms-data
