apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-dns-sync-secrets
  namespace: proxmox-dns-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: proxmox-dns-sync-secrets
    creationPolicy: Owner
  data:
    - secretKey: EXTERNAL_DNS_PROXMOX_TOKEN_ID
      remoteRef:
        key: secret/data/app/proxmox-dns-sync
        property: proxmox_token_id
    - secretKey: EXTERNAL_DNS_PROXMOX_TOKEN_SECRET
      remoteRef:
        key: secret/data/app/proxmox-dns-sync
        property: proxmox_token_secret
    - secretKey: EXTERNAL_DNS_PIHOLE_PASSWORD
      remoteRef:
        key: secret/data/app/proxmox-dns-sync
        property: pihole_password
