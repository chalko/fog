apiVersion: apps/v1
kind: Deployment
metadata:
  name: olah
  namespace: olah
  labels:
    app.kubernetes.io/name: olah
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: olah
  template:
    metadata:
      labels:
        app.kubernetes.io/name: olah
    spec:
      containers:
        - name: olah
          image: ghcr.io/vtuber-plan/olah:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: cache-storage
              mountPath: /app/cache
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: olah-cache-pvc
