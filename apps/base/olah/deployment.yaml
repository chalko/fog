apiVersion: apps/v1
kind: Deployment
metadata:
  name: olah
  namespace: olah
  labels:
    app.kubernetes.io/name: olah
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: olah
  template:
    metadata:
      labels:
        app.kubernetes.io/name: olah
    spec:
      containers:
        - name: olah
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "pip install --no-cache-dir olah && exec python -m olah --host 0.0.0.0 --port 8080 --storage-dir /app/cache"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: cache-storage
              mountPath: /app/cache
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: olah-cache-pvc
