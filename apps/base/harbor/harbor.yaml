apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor-charts
  namespace: harbor
spec:
  interval: 1h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 10m
  chart:
    spec:
      chart: harbor
      version: ">=2.0.0"
      sourceRef:
        kind: HelmRepository
        name: harbor-charts
  values:
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      ingress:
        hosts:
          core: harbor.fog.chalko.com
        controller: default
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
    externalURL: https://harbor.fog.chalko.com
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: local-path
          size: 50Gi
        chartmuseum:
          storageClass: local-path
          size: 5Gi
        jobservice:
          jobLog:
            storageClass: local-path
            size: 5Gi
        database:
          storageClass: local-path
          size: 5Gi
        redis:
          storageClass: local-path
          size: 5Gi
        trivy:
          storageClass: local-path
          size: 5Gi
